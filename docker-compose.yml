services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowflow}
      POSTGRES_USER: ${POSTGRES_USER:-knowflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowflow_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-knowflow_redis_dev_password}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - '${REDIS_PUBLISHED_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: knowflow-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: Dockerfile.minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowflow_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knowflow_minio_dev_secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    command: server /data
    ports:
      - '${MINIO_PUBLISHED_PORT:-9000}:9000'
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowflow}:${POSTGRES_PASSWORD:-knowflow_dev_password}@postgres:5432/${POSTGRES_DB:-knowflow}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-knowflow_redis_dev_password}
      REDIS_DB: ${REDIS_DB:-0}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-bull}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-knowflow_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-knowflow_minio_dev_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowflow-documents}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      UPLOAD_MULTIPART_THRESHOLD_BYTES: ${UPLOAD_MULTIPART_THRESHOLD_BYTES:-33554432}
      UPLOAD_PART_SIZE_BYTES: ${UPLOAD_PART_SIZE_BYTES:-16777216}
      UPLOAD_URL_EXPIRY_SECONDS: ${UPLOAD_URL_EXPIRY_SECONDS:-3600}
      DOCUMENT_PROCESSING_CONCURRENCY: ${DOCUMENT_PROCESSING_CONCURRENCY:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai-compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-1}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_LOCAL_MODEL_PATH: ${EMBEDDING_LOCAL_MODEL_PATH:-}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-compatible}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://host.docker.internal:8001/v1}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_RECALL_CANDIDATE_LIMIT: ${RAG_RECALL_CANDIDATE_LIMIT:-50}
      RAG_RERANK_CANDIDATE_LIMIT: ${RAG_RERANK_CANDIDATE_LIMIT:-50}
      RAG_RETRIEVAL_CACHE_TTL_SECONDS: ${RAG_RETRIEVAL_CACHE_TTL_SECONDS:-300}
    volumes:
      - ${EMBEDDING_LOCAL_MODEL_HOST_PATH:-./models}:/models:ro
    ports:
      - '${PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
